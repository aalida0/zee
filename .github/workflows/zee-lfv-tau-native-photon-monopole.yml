name: Zee original source tau photon monopole and signed K1-K2
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/ORIGINAL_NATIVE_TAU_K1_REPLAY_2026-11-10.json
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/tau_native_monopole_source.py
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/test_tau_native_monopole_source.py
      - .github/workflows/zee-lfv-tau-native-photon-monopole.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-photon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy mpmath
      - name: Validate original K1 source group and physical photon operator signs
        run: python -m unittest research.full_constraints.lfv_2hdm_gitlab_reuse_2026.test_tau_native_monopole_source -v
      - name: Evaluate original native Zee one-loop signed photon subsets
        run: |
          python -m research.full_constraints.lfv_2hdm_gitlab_reuse_2026.tau_native_monopole_source --output tau_photon_native_one_loop_source_only.json
      - uses: actions/upload-artifact@v4
        with:
          name: zee-tau-native-photon-K1K2-source-only-not-physical
          path: tau_photon_native_one_loop_source_only.json
          if-no-files-found: error
