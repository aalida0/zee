name: Zee LFV corrected GitLab 2HDM control
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/**
      - .github/workflows/zee-gitlab-2hdm-control.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout research branch (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy mpmath
      - name: Fetch and verify exact published GitLab revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://gitlab.com/jbrod/general-2hdm-pheno.git /tmp/general-2hdm-pheno
          head=$(git -C /tmp/general-2hdm-pheno rev-parse HEAD)
          echo "GitLab head=$head"
          if [[ "$head" != b5035cd5* ]]; then
            echo 'Upstream code changed: fail closed instead of interpreting unreviewed coefficients.' >&2
            exit 2
          fi
          sha256sum /tmp/general-2hdm-pheno/thdm.py
      - name: Audit corrected official constructor-required inputs
        shell: bash
        run: |
          set -euo pipefail
          sed -n '565,660p' /tmp/general-2hdm-pheno/thdm.py
          grep -n 'self.ip\[' /tmp/general-2hdm-pheno/thdm.py | head -n 90 || true
      - name: Audit corrected GitLab LFV Wilson interfaces
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib
          p=pathlib.Path('/tmp/general-2hdm-pheno/thdm.py')
          tree=ast.parse(p.read_text())
          for cls in [n for n in tree.body if isinstance(n, ast.ClassDef) and n.name=='thdm']:
              methods=[f for f in cls.body if isinstance(f,(ast.FunctionDef,ast.AsyncFunctionDef))]
              names=[f'{f.lineno}:{f.name}' for f in methods
                     if any(key in f.name.lower() for key in ['gamma','loop','radiat','l_to','c_r','c_l','dipole'])]
              print('RELEVANT_2HDM_METHODS', ','.join(names))
              for f in methods:
                  if f.name=='Gamma_l_to_lp_gamma':
                      print('GAMMA_METHOD_SOURCE_START_LINE',f.lineno)
                      print('\n'.join(p.read_text().splitlines()[f.lineno-1:f.end_lineno]))
          PY
      - name: Identify corrected Wilson decomposition for separate loop-order checks
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib
          src=pathlib.Path('/tmp/general-2hdm-pheno/thdm.py').read_text()
          code=src.splitlines(); tree=ast.parse(src)
          for cls in [n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='thdm']:
              funcs=[f for f in cls.body if isinstance(f,ast.FunctionDef)]
              print('LFV_SOURCE_METHODS',[(f.lineno,f.name) for f in funcs
                    if 'llpg' in f.name.lower() or 'cll' in f.name.lower()
                       or 'crl' in f.name.lower()])
              for f in funcs:
                  if f.name in ('cR_llpg','cL_llpg'):
                      print('SOURCE',f.name,'\n'.join(code[f.lineno-1:f.end_lineno]))
          PY
      - name: Inspect corrected source dipole decomposition definitions
        shell: bash
        run: |
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('/tmp/general-2hdm-pheno/thdm.py')
          s=p.read_text().splitlines();tree=ast.parse('\n'.join(s))
          for node in ast.walk(tree):
              if isinstance(node,ast.ClassDef):
                  fs=[f for f in node.body if isinstance(f,ast.FunctionDef) and
                      ('llpg' in f.name.lower() or 'dipole' in f.name.lower())]
                  if fs:
                      print('DIPOLE_CLASS',node.name,'methods',[(x.lineno,x.name) for x in fs])
                      for f in fs:
                          if f.name in ('cR_llpg','cL_llpg'):
                              print('DIPOLE_SOURCE',f.name,'\n'.join(s[f.lineno-1:f.end_lineno]))
          PY
      - name: Evaluate four Zee inputs as pure 2HDM controls (not Zee physics)
        run: |
          python research/full_constraints/lfv_2hdm_gitlab_reuse_2026/official_gitlab_control.py \
            --source /tmp/general-2hdm-pheno \
            --commit b5035cd5 --limit 4 --output official_gitlab_control.json
      - name: Archive source-lock numerical diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zee-two-loop-gitlab-pure-2hdm-control
          path: official_gitlab_control.json
          if-no-files-found: ignore
