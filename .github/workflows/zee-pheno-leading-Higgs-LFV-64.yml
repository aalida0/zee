name: Zee practical LO Higgs and LFV 64-family source-complete ledger
on:
  push:
    branches: [research/zee-full-constraints]
    paths:
      - research/full_constraints/pheno_paper_2026/leading_higgs_lfv_64.py
      - .github/workflows/zee-pheno-leading-Higgs-LFV-64.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-zee-leading-observables:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Pinned numerical stack for native source
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-HLLO"
          uv pip install --python "$RUNNER_TEMP/zee-HLLO/bin/python" flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0 matplotlib==3.10.7
          echo "$RUNNER_TEMP/zee-HLLO/bin" >> "$GITHUB_PATH"
      - name: Source-controlled original 16-scalar 64-family algebraic Zee neutrino reconstruction
        run: |
          python -u -m research.full_constraints.scan_pilot_2026.bounded_16_scalar_64_family --output "$RUNNER_TEMP/zee-source-64-family.json"
      - name: One source family smoke test of every Higgs/LFV operator and width
        run: |
          python -u -m research.full_constraints.pheno_paper_2026.leading_higgs_lfv_64 --input "$RUNNER_TEMP/zee-source-64-family.json" --limit 1 --output "$RUNNER_TEMP/zee-HLLO-one-smoke.json"
      - name: All 64 native LO neutral and flavor observables
        run: |
          python -u -m research.full_constraints.pheno_paper_2026.leading_higgs_lfv_64 --input "$RUNNER_TEMP/zee-source-64-family.json" --output "$RUNNER_TEMP/zee-HLLO-64-family.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zee-practical-64-Higgs-LFV-leading-order-width-floors-not-complete-acceptance
          path: |
            ${{ runner.temp }}/zee-HLLO-one-smoke.json
            ${{ runner.temp }}/zee-HLLO-64-family.json
          retention-days: 30
          if-no-files-found: warn
