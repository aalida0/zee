name: Zee exact finite-mass tau LFV dipole phase space
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/tau_exact_dipole_phase_space.py
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/test_tau_exact_dipole_phase_space.py
      - .github/workflows/zee-lfv-tau-exact-dipole.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-dipole:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath
      - name: Validate exact dipole kernels and restricted-only norm envelopes
        run: |
          python -m unittest research.full_constraints.lfv_2hdm_gitlab_reuse_2026.test_tau_exact_dipole_phase_space -v
          python -m research.full_constraints.lfv_2hdm_gitlab_reuse_2026.tau_exact_dipole_phase_space --ns 64 --nz 24 --tree-order 14 --output tau_exact_dipole_and_envelopes.json
      - uses: actions/upload-artifact@v4
        with:
          name: zee-exact-tau-dipole-and-conditional-tree-envelope
          path: tau_exact_dipole_and_envelopes.json
          if-no-files-found: error
