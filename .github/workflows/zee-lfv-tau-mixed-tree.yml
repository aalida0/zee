name: Zee LFV tau mixed-flavour tree subsets
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/tau_mixed_flavour_tree.py
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/test_tau_mixed_flavour_tree.py
      - .github/workflows/zee-lfv-tau-mixed-tree.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check numpy mpmath
      - name: Compare mixed neutral scalar exact vs contact tree results
        run: |
          python -m unittest research.full_constraints.lfv_2hdm_gitlab_reuse_2026.test_tau_mixed_flavour_tree -v
          python -m research.full_constraints.lfv_2hdm_gitlab_reuse_2026.tau_mixed_flavour_tree --order 14 --output tau_mixed_flavour_tree_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: zee-tau-mixed-neutral-tree-only
          path: tau_mixed_flavour_tree_result.json
          if-no-files-found: error
