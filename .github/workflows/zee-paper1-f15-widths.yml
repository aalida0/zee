name: Zee Paper1 F15 real complex heavy scalar width audit
on:
  push:
    branches: [feature/global-scan-priority1]
    paths:
      - 'scripts/zee_paper1_F15_charged_width_CKM_mass_scheme_audit.py'
      - 'scripts/zee_paper1_F15_charged_width_CKM_one_shot.sh'
      - 'tests/test_zee_paper1_F15_charged_width_CKM_mass_scheme_audit.py'
      - '.github/workflows/zee-paper1-f15-widths.yml'
  workflow_dispatch:
jobs:
  real-heavy-zeemodel-neutrino-ckm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy
      - run: python -m py_compile scripts/zee_paper1_F15_charged_width_CKM_mass_scheme_audit.py
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_F15_charged_width_CKM_mass_scheme_audit.py' -v
      - run: bash -n scripts/zee_paper1_F15_charged_width_CKM_one_shot.sh
