name: Zee 2026 B gamma leading-NP headroom and quadratic remainder diagnostics
on:
  push:
    branches: [research/zee-full-constraints]
    paths:
      - research/full_constraints/bsgamma_flavio_2026/np_remainder_budget.py
      - research/full_constraints/bsgamma_flavio_2026/test_np_remainder_budget.py
      - .github/workflows/zee-bsgamma-2026-NP-remainder.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  differential-2026-B-study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Pinned independent flavio and original Zee NLO matching
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-b2026"
          uv pip install --python "$RUNNER_TEMP/zee-b2026/bin/python" flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0
          echo "$RUNNER_TEMP/zee-b2026/bin" >> "$GITHUB_PATH"
      - name: Verify coherent NLO matching, 670GeV 2HDM limit scope, amplitude curvature
        run: |
          python -m unittest research.full_constraints.bsgamma_flavio_2026.test_np_remainder_budget -v
      - name: Archive 16 original Zee scalar Misiak positive budget and flavio quadratic results
        run: |
          python -u -m research.full_constraints.bsgamma_flavio_2026.np_remainder_budget --output "$RUNNER_TEMP/zee-Bsgamma-2026-16-scalar-NP-budget.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zee-Bsgamma-2026-16-scalar-NP-headroom-not-certified-uncertainty
          path: ${{ runner.temp }}/zee-Bsgamma-2026-16-scalar-NP-budget.json
          if-no-files-found: error
          retention-days: 30
