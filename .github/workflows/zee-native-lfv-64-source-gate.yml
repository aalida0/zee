name: Zee TypeII exact 64 complex SPheno FlavorKit SLHA source gate (no native physics without original Fortran)
on:
  workflow_dispatch:
  push:
    branches: [research/zee-full-constraints]
    paths:
      - research/full_constraints/lfv_64_native_2026/**
      - .github/workflows/zee-native-lfv-64-source-gate.yml
permissions:
  contents: read
jobs:
  source_64_lfv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Freeze original neutrino input toolchain
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-lfv64"
          uv pip install --python "$RUNNER_TEMP/zee-lfv64/bin/python" \
            flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 \
            mpmath==1.3.0 sympy==1.14.0 matplotlib==3.10.7
          echo "$RUNNER_TEMP/zee-lfv64/bin" >> "$GITHUB_PATH"
      - name: Execute six source-integrity and exact complex-matrix regression tests
        run: python -m unittest research.full_constraints.lfv_64_native_2026.test_spheno_64_source_gate -v
      - name: Recreate original 16x4 physical scalar and engineered neutrino source
        run: |
          python -u -m research.full_constraints.scan_pilot_2026.bounded_16_scalar_64_family \
            --output "$RUNNER_TEMP/zee-16x4-sourced-models.json"
      - name: Generate exact 64 complex F/Ye2 SLHA cards for source-bound local native SPheno
        run: |
          cat > "$RUNNER_TEMP/unvalidated-SPheno-source-template.in" <<'EOF'
          Block MODSEL
            1 0
          Block SMINPUTS
            2 1.1663787e-5
            4 91.1876
            5 4.18
            6 172.76
            7 1.77686
          Block MINPAR
            1 1.0
            10 2.0
          Block FZEE
            1 2 0.0
          Block YEE2
            1 1 0.0
          Block SPHENOINPUT
            55 0
          EOF
          python -u -m research.full_constraints.lfv_64_native_2026.spheno_64_source_gate \
            --source "$RUNNER_TEMP/zee-16x4-sourced-models.json" \
            --template "$RUNNER_TEMP/unvalidated-SPheno-source-template.in" \
            --cards-dir "$RUNNER_TEMP/zee-64-complex-SLHA-not-native-validated"
          python - <<'PY'
          from pathlib import Path
          import json,os
          f=Path(os.environ['RUNNER_TEMP'])/'zee-64-complex-SLHA-not-native-validated'/'source-manifest.json'
          d=json.loads(f.read_text())
          assert d['new_family_count']==64
          assert len(d['cards'])==64
          assert all(x['physical_mu3e'] is None for x in d['cards'])
          print('ZEE_64_INPUTS_VERIFIED_NATIVE_LFV_NOT_EXECUTED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zee-exact-64-inputs-NOT-native-LFV-rates
          path: |
            ${{ runner.temp }}/zee-64-complex-SLHA-not-native-validated/
            ${{ runner.temp }}/zee-16x4-sourced-models.json
          if-no-files-found: warn
          retention-days: 30
