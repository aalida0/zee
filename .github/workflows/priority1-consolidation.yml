name: Priority1 Consolidated Physics Intake
on:
  push:
    branches:
      - feature/global-scan-priority1-integration
      - feature/global-scan-priority1
  pull_request:
  workflow_dispatch:

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Priority1 source interfaces
        run: |
          python -m py_compile scripts/zee_priority1_cli.py scripts/zee_priority1_streaming.py scripts/zee_priority1_charged_width_export.py scripts/zee_priority1_production_lhe.py
      - name: Existing feature branch contracts
        run: |
          python -m unittest discover -s tests -p 'test_zee_priority1_global_contracts.py' -v
      - name: Seven unification and real-source ingestion regression tests
        run: |
          python -m unittest discover -s tests -p 'test_zee_priority1_unification.py' -v
      - name: Five source-pinned E2-E3 provenance tests
        run: |
          python -m unittest discover -s tests -p 'test_zee_priority1_309_source_pairing.py' -v

  original-B3-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Numerical Zee mass and B3 dependencies
        run: |
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Original GateB3 general Zee charged LO physics regression
        run: |
          python -m unittest discover -s tests -p 'test_gateB3_general_zee_charged_lepton_widths.py' -v
      - name: Source-connected real E3-B3 Priority1 integration
        run: |
          python -m unittest discover -s tests -p 'test_zee_priority1_real_charged_widths.py' -v
      - name: Neutral h H A 12-channel exact tree partial widths and B3 source join
        run: |
          python -m unittest discover -s tests -p 'test_zee_priority1_neutral_two_body.py' -v
      - name: Bosonic N2 gauge and charged-scalar-pair physical partial widths
        run: |
          python -m unittest discover -s tests -p 'test_zee_priority1_neutral_bosonic_two_body.py' -v
      - name: Five-state N1 to N2 source-preserving join safety checks
        run: |
          python -m unittest discover -s tests -p 'test_zee_priority1_neutral_bosonic_309_join.py' -v
