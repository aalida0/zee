name: Zee historical vacuum-certified LFV local eta minimization
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/scan_pilot_2026/historical_eta_minimum.py
      - research/full_constraints/scan_pilot_2026/test_historical_eta_minimum.py
      - .github/workflows/zee-historical-local-lfv-minima.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-historical-local-minima:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Original D14 pinned interpreter and numerical packages
        run: |
          uv python install 3.10.12
          uv venv --python 3.10.12 "$RUNNER_TEMP/zee-hist-eta"
          uv pip install --python "$RUNNER_TEMP/zee-hist-eta/bin/python" numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0
          echo "$RUNNER_TEMP/zee-hist-eta/bin" >> "$GITHUB_PATH"
      - name: Test historical original LFV and bounded local minimum
        run: python -m unittest research.full_constraints.scan_pilot_2026.test_historical_eta_minimum -v
      - name: Validate four source-matched candidate local LFV minima and selected full D4 widths
        run: |
          python -m research.full_constraints.scan_pilot_2026.historical_eta_minimum --output "$RUNNER_TEMP/zee-historical-local-LFV-minima.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zee-historical-vacuum16-four-candidate-source-matched-eta-minima
          path: ${{ runner.temp }}/zee-historical-local-LFV-minima.json
          if-no-files-found: error
          retention-days: 30
