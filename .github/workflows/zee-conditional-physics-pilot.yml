name: Zee conditional correlated pilot 2026-11-10 (not global allowed)
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/scan_pilot_2026/**
      - .github/workflows/zee-conditional-physics-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install exact original Python 3.10.12 and frozen numerical packages
        run: |
          uv python install 3.10.12
          uv venv --python 3.10.12 "$RUNNER_TEMP/zee-pinned-python"
          uv pip install --python "$RUNNER_TEMP/zee-pinned-python/bin/python" numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0 matplotlib==3.10.9 jsonschema
          echo "$RUNNER_TEMP/zee-pinned-python/bin" >> "$GITHUB_PATH"
      - name: Assert exact Python patch-version pin
        run: python -c 'import platform; assert platform.python_version()=="3.10.12", platform.python_version()'
      - name: Execute existing immutable replay/regression suite before scan
        run: python scripts/zee_d14_workflow_tests.py
      - name: Run independent 400-proposal conditional pilot with four neutrino families
        run: |
          python -m research.full_constraints.scan_pilot_2026.run_conditional_pilot --output "$RUNNER_TEMP/zee-conditional-pilot-20261110" --count 400 --seed 20261110 --shard-size 40
      - name: Archive source-bound proposals, receipt-checked workers and conditional results
        uses: actions/upload-artifact@v4
        with:
          name: zee-conditional-pilot-400-no-global-acceptance
          path: ${{ runner.temp }}/zee-conditional-pilot-20261110/
          if-no-files-found: error
          retention-days: 30
