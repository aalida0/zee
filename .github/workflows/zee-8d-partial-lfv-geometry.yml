name: Zee eight-real-dimensional retained dipole differential rank
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/scan_pilot_2026/lfv_partial_geometry.py
      - .github/workflows/zee-8d-partial-lfv-geometry.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-jacobian:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Pinned physics environment
        run: |
          uv python install 3.10.12
          uv venv --python 3.10.12 "$RUNNER_TEMP/zee-jac"
          uv pip install --python "$RUNNER_TEMP/zee-jac/bin/python" numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0
          echo "$RUNNER_TEMP/zee-jac/bin" >> "$GITHUB_PATH"
      - name: Direct eight-dimensional Jacobian and signed null directions
        run: |
          python -m research.full_constraints.scan_pilot_2026.lfv_partial_geometry --output "$RUNNER_TEMP/zee-2264-8d-Jacobian.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zee-2264-8d-partial-dipole-local-rank-not-full-LFV
          path: ${{ runner.temp }}/zee-2264-8d-Jacobian.json
          if-no-files-found: error
          retention-days: 30
