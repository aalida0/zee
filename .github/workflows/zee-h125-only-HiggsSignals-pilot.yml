name: Zee h125 and charged and heavy-neutral source-pinned experimental screening (not full model)
on:
  workflow_dispatch:
  push:
    branches: [research/zee-full-constraints]
    paths:
      - research/full_constraints/pheno_paper_2026/h125_higgssignals_probe.py
      - research/full_constraints/pheno_paper_2026/test_h125_higgssignals_probe.py
      - research/full_constraints/pheno_paper_2026/h125_higgsbounds_probe.py
      - research/full_constraints/pheno_paper_2026/H2_charged_higgsbounds_probe.py
      - research/full_constraints/pheno_paper_2026/test_H2_charged_higgsbounds_probe.py
      - research/full_constraints/pheno_paper_2026/charged_h1h2_public_64.py
      - research/full_constraints/pheno_paper_2026/test_charged_h1h2_public_64.py
      - research/full_constraints/pheno_paper_2026/neutral_HA_higgsbounds_64.py
      - research/full_constraints/pheno_paper_2026/test_neutral_HA_higgsbounds_64.py
      - .github/workflows/zee-h125-only-HiggsSignals-pilot.yml
permissions:
  contents: read
  actions: read
jobs:
  h125-single-resonance-signal-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HIGGSTOOLS_VERSION_GIT: "65029037"
      HSDATASET_PIN: "3c6c2538d9ba0549ea0559cf9b38c18eb80c3af1"
      HBDATASET_PIN: "3539f9adf3724f8752701208bf059d1658824cd2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned Python 3.11 and math stack
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-HS"
          uv pip install --python "$RUNNER_TEMP/zee-HS/bin/python" flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0 matplotlib==3.10.7
          echo "$RUNNER_TEMP/zee-HS/bin" >> "$GITHUB_PATH"
      - name: Test source Zee LFV width and double-counting guards
        run: |
          python -m unittest research.full_constraints.pheno_paper_2026.test_h125_higgssignals_probe -v
          python -m unittest research.full_constraints.pheno_paper_2026.test_H2_charged_higgsbounds_probe -v
          python -m unittest research.full_constraints.pheno_paper_2026.test_charged_h1h2_public_64 -v
          python -m unittest research.full_constraints.pheno_paper_2026.test_neutral_HA_higgsbounds_64 -v
      - name: Obtain original 64 source Yukawa+Higgs widths
        run: |
          python -m research.full_constraints.scan_pilot_2026.bounded_16_scalar_64_family --output "$RUNNER_TEMP/source-64.json"
          python -m research.full_constraints.pheno_paper_2026.leading_higgs_lfv_64 --input "$RUNNER_TEMP/source-64.json" --output "$RUNNER_TEMP/source-64-HL.json"
      - name: Fetch pinned HiggsTools v1.1.3 source (not PyPI unrelated hgtools)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.1.3 https://gitlab.com/higgsbounds/higgstools.git "$RUNNER_TEMP/higgstools"
          cd "$RUNNER_TEMP/higgstools"
          git rev-parse HEAD
          test "$(git rev-parse HEAD | cut -c1-8)" = "$HIGGSTOOLS_VERSION_GIT"
      - name: Compile and install HiggsTools Python C++ extension
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --python "$RUNNER_TEMP/zee-HS/bin/python" \
            'cmake>=3.25,<4' scikit-build==0.18.1 pybind11==2.13.6 setuptools==80.9.0 wheel==0.45.1
          # HiggsTools v1.1.3 third-party JSON's CMake minimum is
          # incompatible with CMake 4; use source-compatible CMake 3.x.
          uv pip install --no-build-isolation --python "$RUNNER_TEMP/zee-HS/bin/python" \
            "$RUNNER_TEMP/higgstools" 2>&1 | tee "$RUNNER_TEMP/higgs-install.log"
          "$RUNNER_TEMP/zee-HS/bin/python" -c "import Higgs; print('HIGGSTOOLS_LOADED',Higgs.__file__)"
      - name: Fetch exact formerly validated HiggsSignals measurement dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/hsdataset"
          git -C "$RUNNER_TEMP/hsdataset" init
          git -C "$RUNNER_TEMP/hsdataset" remote add origin https://gitlab.com/higgsbounds/hsdataset.git
          git -C "$RUNNER_TEMP/hsdataset" fetch --depth 1 origin "$HSDATASET_PIN"
          git -C "$RUNNER_TEMP/hsdataset" checkout --detach "$HSDATASET_PIN"
          echo "HSDATASET_PINNED $(git -C "$RUNNER_TEMP/hsdataset" rev-parse HEAD)"
      - name: Compare 64 source Zee h125 effective-coupling inputs with same-dataset SM
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.full_constraints.pheno_paper_2026.h125_higgssignals_probe \
            --source "$RUNNER_TEMP/source-64-HL.json" \
            --dataset "$RUNNER_TEMP/hsdataset" \
            --output "$RUNNER_TEMP/zee-h125-only-HiggsSignals-deltaChi2.json"
      - name: Fetch formerly source-validated HiggsBounds observed-limit dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/hbdataset"
          git -C "$RUNNER_TEMP/hbdataset" init
          git -C "$RUNNER_TEMP/hbdataset" remote add origin https://gitlab.com/higgsbounds/hbdataset.git
          git -C "$RUNNER_TEMP/hbdataset" fetch --depth 1 origin "$HBDATASET_PIN"
          git -C "$RUNNER_TEMP/hbdataset" checkout --detach "$HBDATASET_PIN"
          echo "HBDATASET_PINNED $(git -C "$RUNNER_TEMP/hbdataset" rev-parse HEAD)"
      - name: Apply h125-only HiggsBounds observed limits to all 64 new Zee families
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.full_constraints.pheno_paper_2026.h125_higgsbounds_probe \
            --source "$RUNNER_TEMP/source-64-HL.json" \
            --dataset "$RUNNER_TEMP/hbdataset" \
            --output "$RUNNER_TEMP/zee-h125-only-HiggsBounds-observed.json"
      - name: Evaluate actual 13 TeV Zee tbH2 source MG5 and D4 64-family direct charged-Higgs limits
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.full_constraints.pheno_paper_2026.H2_charged_higgsbounds_probe \
            --source "$RUNNER_TEMP/source-64.json" \
            --dataset "$RUNNER_TEMP/hbdataset" \
            --output "$RUNNER_TEMP/zee-64-H2-charged-HiggsBounds-13TeV-LO-subset.json"
      - name: Both Zee charged states H1 and H2 matched 4FS-5FS tbH in actual HiggsBounds
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.full_constraints.pheno_paper_2026.charged_h1h2_public_64 \
            --source "$RUNNER_TEMP/source-64.json" \
            --dataset "$RUNNER_TEMP/hbdataset" \
            --output "$RUNNER_TEMP/zee-64-both-charged-H1H2-public-matched-13TeV-HB.json"
      - name: Download source-pinned exact prior 16-spectrum SusHi and 64-family HDECAY receipts
        uses: actions/download-artifact@v4
        with:
          name: zee-16-source-SusHi-neutral-H-A-13TeV-LO-no-global-Higgs-exclusion
          run-id: 43122137634
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/zee-neutral-sushi-16
      - name: Download 16-spectrum 64-family native Zee HDECAY composite receipts
        uses: actions/download-artifact@v4
        with:
          name: zee-HDECAY-16-quark-QCD-and-doublet-control-partial-widths-NOT-ZEE-total
          run-id: 43119479264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/zee-neutral-hdecay-64
      - name: Compare real 13 TeV H/A ggF and bbH with actual HiggsBounds direct heavy searches
        shell: bash
        run: |
          set -euo pipefail
          python -u -m research.full_constraints.pheno_paper_2026.neutral_HA_higgsbounds_64 \
            --sushi "$RUNNER_TEMP/zee-neutral-sushi-16/zee-SusHi-16-HA-real-production.json" \
            --widths "$RUNNER_TEMP/zee-neutral-hdecay-64/zee-HDECAY-native-H-A-64-mixed-order-incomplete.json" \
            --dataset "$RUNNER_TEMP/hbdataset" \
            --output "$RUNNER_TEMP/zee-H-A-heavy-HiggsBounds-64-optimistic-width-LO-envelope.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zee-h125-only-HiggsSignals-source-pin-stated-scope-NOT-Higgs-complete
          path: |
            ${{ runner.temp }}/zee-h125-only-HiggsSignals-deltaChi2.json
            ${{ runner.temp }}/zee-h125-only-HiggsBounds-observed.json
            ${{ runner.temp }}/zee-64-H2-charged-HiggsBounds-13TeV-LO-subset.json
            ${{ runner.temp }}/zee-64-both-charged-H1H2-public-matched-13TeV-HB.json
            ${{ runner.temp }}/zee-H-A-heavy-HiggsBounds-64-optimistic-width-LO-envelope.json
            ${{ runner.temp }}/higgs-install.log
          if-no-files-found: warn
          retention-days: 30
