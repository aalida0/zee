name: Priority 1 Global Scan Contracts

on:
  push:
    branches:
      - feature/global-scan-priority1
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install numpy
      - name: Syntax compile priority-1 code
        run: |
          python -m py_compile scripts/zee_priority1_contracts.py scripts/zee_priority1_higgstools.py scripts/zee_priority1_cli.py scripts/zee_priority1_neutrino_gaussian.py scripts/zee_priority1_coherent_lfv.py tests/test_zee_priority1_global_contracts.py tests/test_zee_priority1_numerics.py
      - name: Twelve independent source-safe tests
        run: |
          python -m unittest discover -s tests -p 'test_zee_priority1_global_contracts.py' -v
      - name: Ten real numerical Takagi and LFV interference regressions
        run: |
          python -m unittest discover -s tests -p 'test_zee_priority1_numerics.py' -v
