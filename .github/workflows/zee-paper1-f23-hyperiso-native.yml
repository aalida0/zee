name: F23 HyperIso Integrated Native Physics
on:
  push:
    branches:
      - feature/global-scan-priority1
    paths:
      - 'cpp/F23_hyperiso/**'
      - 'scripts/zee_paper1_F23_hyperiso_one_shot_integrated_157.py'
      - 'tests/test_zee_paper1_F23_hyperiso_integrated_contracts.py'
      - '.github/workflows/zee-paper1-f23-hyperiso-native.yml'
  workflow_dispatch:

jobs:
  native-full-upstream-build-and-observable:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: System scientific libraries and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgsl-dev libeigen3-dev libboost-dev \
            libboost-system-dev libboost-filesystem-dev libboost-thread-dev \
            libopenblas-dev liblapack-dev python3
      - name: Python F22 original source and 157/9 production contract
        run: |
          python3 -m py_compile scripts/zee_paper1_F23_hyperiso_one_shot_integrated_157.py
          python3 -m unittest discover -s tests \
            -p 'test_zee_paper1_F23_hyperiso_integrated_contracts.py' -v
      - name: Clone exact 2026 HyperIso v1.0.3 source PIN
        run: |
          git clone --quiet --branch v1.0.3 --depth 1 \
            https://github.com/Hyperiso/Hyperiso.git /tmp/hyperiso-F23-v103
          test "$(git -C /tmp/hyperiso-F23-v103 rev-parse HEAD)" = \
            09d26ac6e71d1528922097a896d15693589f636b
          test -z "$(git -C /tmp/hyperiso-F23-v103 status --porcelain)"
      - name: Build full native HyperIso tagged C++ CLI
        run: |
          cmake -S /tmp/hyperiso-F23-v103/Hyperiso/Hyperiso/core \
            -B /tmp/hyperiso-F23-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_CLI=ON \
            -DBUILD_WITH_MARTY=OFF -DBUILD_WITH_SOFTSUSY=OFF \
            -DBUILD_WITH_PYTHON=OFF \
            -DCMAKE_INSTALL_PREFIX=/tmp/hyperiso-F23-install
          cmake --build /tmp/hyperiso-F23-build --parallel 2
          cmake --install /tmp/hyperiso-F23-build
      - name: Compile Zee mixed C3-C8 LO NLO NNLO matching patch executable
        run: |
          cmake -S cpp/F23_hyperiso -B /tmp/F23-zee-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/hyperiso-F23-install
          cmake --build /tmp/F23-zee-build --parallel 2
      - name: Execute real HyperIso SM and mixed-charged THDM physics
        run: |
          python3 - <<'PY'
          import importlib.util,pathlib,subprocess,re
          root=pathlib.Path("/tmp/hyperiso-F23-v103/reproducibility")
          sm=root/"inputs/sm_reference.flha"
          th=root/"inputs/thdm_reference.lha"
          exe=list(pathlib.Path("/tmp/hyperiso-F23-build").rglob("hyperiso-ui"))
          exe=[x for x in exe if x.is_file() and x.stat().st_mode & 0o111]
          assert len(exe)==1,exe
          cmd=[str(exe[0]),"observable","summary","--model","SM",
               "--lha",str(sm),"--observables","BR_B__Xs_gamma","--order","NNLO"]
          p=subprocess.run(cmd,capture_output=True,text=True,check=True)
          print(p.stdout)
          found=re.findall(r'BR_B__Xs_gamma\s*=\s*([0-9.eE+\-]+)',p.stdout)
          assert found and abs(float(found[-1])-.00032967)<1e-8,found
          modpath=pathlib.Path("scripts/zee_paper1_F23_hyperiso_one_shot_integrated_157.py")
          spec=importlib.util.spec_from_file_location("f23",modpath)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          patched=pathlib.Path("/tmp/F23_reference_2HDMC_Zee_matching.lha")
          patched.write_text(mod.update_spectrum(th,310.553778,10.))
          binary="/tmp/F23-zee-build/zee_hyperiso_two_state"
          for p in ((310.553778,700.,10.,0.),
                    (310.553778,700.,10.,1.10),
                    (310.553778,700.,10.,1.5707963267948966),
                    (310.553778,310.553778,10.,.91)):
              res=subprocess.run([binary,str(patched),*map(str,p)],
                 capture_output=True,text=True,check=True)
              print(res.stdout)
              print(res.stderr[-1000:])
              assert "F23_HYPERISO_V103_TWO_STATE_CONDITIONAL" in res.stdout
          PY
