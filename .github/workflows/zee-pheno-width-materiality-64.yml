name: Zee 64-family heavy photon-loop and finite-width materiality audit
on:
  workflow_dispatch:
  push:
    branches: [research/zee-full-constraints]
    paths:
      - research/full_constraints/pheno_paper_2026/heavy_HA_diphoton_64.py
      - research/full_constraints/pheno_paper_2026/test_heavy_HA_diphoton_64.py
      - research/full_constraints/pheno_paper_2026/width_threshold_audit_64.py
      - research/full_constraints/pheno_paper_2026/test_width_threshold_audit_64.py
      - .github/workflows/zee-pheno-width-materiality-64.yml
permissions:
  contents: read
  actions: read
jobs:
  native-zee-neutral-and-charged-thresholds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Pinned source neutrino and charged-channel numerical toolchain
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-materiality"
          uv pip install --python "$RUNNER_TEMP/zee-materiality/bin/python" \
            flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 \
            mpmath==1.3.0 sympy==1.14.0 matplotlib==3.10.7
          echo "$RUNNER_TEMP/zee-materiality/bin" >> "$GITHUB_PATH"
      - name: Validate D7 F13 original complex photon-loop and threshold source
        run: |
          python -m unittest research.full_constraints.pheno_paper_2026.test_heavy_HA_diphoton_64 -v
          python -m unittest research.full_constraints.pheno_paper_2026.test_width_threshold_audit_64 -v
      - name: Recover original 16x4 source algebraic Zee neutrino cards
        run: |
          python -u -m research.full_constraints.scan_pilot_2026.bounded_16_scalar_64_family \
            --output "$RUNNER_TEMP/zee-original-64-source.json"
      - name: Download original HDECAY-source 64 family full exotic-inclusive partial ledgers
        uses: actions/download-artifact@v4
        with:
          name: zee-HDECAY-16-quark-QCD-and-doublet-control-partial-widths-NOT-ZEE-total
          run-id: 43119479264
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/zee-hdecay-original-64
      - name: Execute 64 heavy H/A two-charged-eigenstate photon loop materiality
        run: |
          python -u -m research.full_constraints.pheno_paper_2026.heavy_HA_diphoton_64 \
            --source "$RUNNER_TEMP/zee-original-64-source.json" \
            --widths "$RUNNER_TEMP/zee-hdecay-original-64/zee-HDECAY-native-H-A-64-mixed-order-incomplete.json" \
            --output "$RUNNER_TEMP/zee-64-heavy-gamma-gamma-materiality.json"
      - name: Audit 64 charged and heavy-neutral width/threshold buffers
        run: |
          python -u -m research.full_constraints.pheno_paper_2026.width_threshold_audit_64 \
            --source "$RUNNER_TEMP/zee-original-64-source.json" \
            --widths "$RUNNER_TEMP/zee-hdecay-original-64/zee-HDECAY-native-H-A-64-mixed-order-incomplete.json" \
            --output "$RUNNER_TEMP/zee-64-width-threshold-gates.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zee-64-source-photon-loop-and-width-threshold-NOT-physical-Higgs-acceptance
          path: |
            ${{ runner.temp }}/zee-64-heavy-gamma-gamma-materiality.json
            ${{ runner.temp }}/zee-64-width-threshold-gates.json
          if-no-files-found: warn
          retention-days: 30
