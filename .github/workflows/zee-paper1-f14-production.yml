name: Zee Paper1 F14 13TeV production table validation
on:
  push:
    branches: [feature/global-scan-priority1]
    paths:
      - 'scripts/zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py'
      - 'scripts/zee_paper1_F14_LHCHXSWG_13TeV_one_shot.sh'
      - 'tests/test_zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py'
      - '.github/workflows/zee-paper1-f14-production.yml'
  workflow_dispatch:
jobs:
  validate-interpolation-and-physics-bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy
      - run: python -m py_compile scripts/zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py tests/test_zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py' -v
      - run: bash -n scripts/zee_paper1_F14_LHCHXSWG_13TeV_one_shot.sh
