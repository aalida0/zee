name: Zee Paper1 F14 13TeV production table validation
on:
  push:
    branches: [feature/global-scan-priority1]
    paths:
      - 'scripts/zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py'
      - 'scripts/zee_paper1_F14_LHCHXSWG_13TeV_one_shot.sh'
      - 'tests/test_zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py'
      - '.github/workflows/zee-paper1-f14-production.yml'
  workflow_dispatch:
jobs:
  validate-interpolation-and-physics-bookkeeping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy
      - run: python -m py_compile scripts/zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py tests/test_zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade.py' -v
      - run: bash -n scripts/zee_paper1_F14_LHCHXSWG_13TeV_one_shot.sh
      - name: Probe actual CERN grid format (network permitting)
        run: |
          curl -fsSL --retry 1 --connect-timeout 8 --max-time 40 'https://twiki.cern.ch/twiki/pub/LHCPhysics/LHCHWGMSSMCharged/mflechl_xsec_13TeV_tHp_2016_2_5.txt' -o /tmp/lhchxswg_13.txt || { echo 'F14_SOURCE_DOWNLOAD_UNAVAILABLE_ON_GITHUB_RUNNER_AF_REQUIRED'; exit 0; }
          PYTHONPATH=scripts python - <<'PY'
          from zee_paper1_F14_LHCHXSWG_13TeV_physical_unit_cascade import read_grid,interpolate
          g=read_grid('/tmp/lhchxswg_13.txt')
          print('F14_REAL_OFFICIAL_GRID',{'n':g['points'],'masses':len(g['masses']),'tanbetas':len(g['tanbetas']),'sha256':g['raw_SHA256']})
          for m,t in [(885.8,5.341),(873.2,5.308),(858.6,5.618),(881.5,5.341),(835.9,5.618),(951.2,5.671),(823.4,5.225),(878.8,5.156),(1123.64,5.37)]:
            z=interpolate(g,m,t)
            print('F14_ROUNDED_PROMPT_MASS_ONLY_NOT_SOURCE_PINNED',m,t,z['TypeII_Santander_NLO13TeV_sigma_pb'],z['TypeII_total_uncminus_pb'],z['TypeII_total_uncplus_pb'])
          PY
