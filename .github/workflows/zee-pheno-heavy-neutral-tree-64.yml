name: Zee 64 new neutrino families heavy H A on-shell tree width lower bounds
on:
  push:
    branches: [research/zee-full-constraints]
    paths:
      - research/full_constraints/pheno_paper_2026/heavy_HA_tree_widths.py
      - research/full_constraints/pheno_paper_2026/test_heavy_HA_tree_widths.py
      - .github/workflows/zee-pheno-heavy-neutral-tree-64.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verified-heavy-neutral-tree-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Pin original neutrino and scalar tree conventions
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-HA"
          uv pip install --python "$RUNNER_TEMP/zee-HA/bin/python" flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0
          echo "$RUNNER_TEMP/zee-HA/bin" >> "$GITHUB_PATH"
      - name: Test heavy neutral on-shell modes, double counting, missing widths and total-width nonpromotion
        run: python -m unittest research.full_constraints.pheno_paper_2026.test_heavy_HA_tree_widths -v
      - name: Regenerate exact 16 scalar 64 fresh neutrino Yukawa model inputs
        run: |
          python -u -m research.full_constraints.scan_pilot_2026.bounded_16_scalar_64_family \
            --output "$RUNNER_TEMP/fresh-64.json"
      - name: Compute actual 64 new Yukawa heavy H and A tree channel rate inventories
        run: |
          python -u -m research.full_constraints.pheno_paper_2026.heavy_HA_tree_widths \
            --fresh-json "$RUNNER_TEMP/fresh-64.json" \
            --output "$RUNNER_TEMP/zee-heavy-H-A-tree-partial-lower-bounds-64.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zee-heavy-H-A-source-64-tree-width-ledger-NOT-physical-HiggsTools
          path: ${{ runner.temp }}/zee-heavy-H-A-tree-partial-lower-bounds-64.json
          if-no-files-found: error
          retention-days: 30
