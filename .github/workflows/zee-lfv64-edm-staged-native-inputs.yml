name: Zee EDM-repaired 64 — source-gated native SLHA input staging only
on:
  workflow_dispatch:
  push:
    branches:
      - research/zee-lfv64-closure-20261113
    paths:
      - research/full_constraints/lfv_literature_closure_2026/stage_edm_repaired_native_64.py
      - research/full_constraints/lfv_literature_closure_2026/run_repaired64_native_source.py
      - .github/workflows/zee-lfv64-edm-staged-native-inputs.yml
permissions:
  contents: read
  actions: read
jobs:
  stage_64_source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Pin Zee Python toolchain
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-staging"
          uv pip install --python "$RUNNER_TEMP/zee-staging/bin/python" \
            flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 \
            mpmath==1.3.0 sympy==1.14.0 matplotlib==3.10.7
          echo "$RUNNER_TEMP/zee-staging/bin" >> "$GITHUB_PATH"
      - name: Retrieve exact original native-source input-artifact identity (synthetic CI, NOT physics)
        uses: actions/download-artifact@v4
        with:
          name: zee-exact-64-inputs-NOT-native-LFV-rates
          run-id: 43130710614
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/old_inputs
      - name: Retrieve genuine three-zero neutrino exact new 64 source results
        uses: actions/download-artifact@v4
        with:
          name: zee-edm-suppressed-64-new-textures-conditional-only
          run-id: 43492562878
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/new_inputs
      - name: Compile source-attested new64 native runner (no private model execution)
        run: |
          python -m py_compile research/full_constraints/lfv_literature_closure_2026/stage_edm_repaired_native_64.py
          python -m py_compile research/full_constraints/lfv_literature_closure_2026/run_repaired64_native_source.py
      - name: Generate staged new complex Zee 64 cards only, with explicit synthetic provenance
        shell: bash
        run: |
          set -euo pipefail
          source_json=$(find "$RUNNER_TEMP/new_inputs" -name EDM_SUPPRESSED_64_NEUTRINO_AND_2HDM.json -print -quit)
          input_template=$(find "$RUNNER_TEMP/old_inputs" -name 'zee_*.in' -print -quit)
          test -f "$source_json"
          test -f "$input_template"
          python -m research.full_constraints.lfv_literature_closure_2026.stage_edm_repaired_native_64 \
             --source "$source_json" --template "$input_template" \
             --template-provenance SYNTHETIC_CI_NOT_FOR_PHYSICS \
             --output-dir "$RUNNER_TEMP/staged-edm3zero-64"
          python - <<'PY'
          from pathlib import Path
          import json,os
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'staged-edm3zero-64'/'manifest-new-EDM3zero.json').read_text())
          assert r['n_cards']==64
          assert r['template_provenance']=='SYNTHETIC_CI_NOT_FOR_PHYSICS'
          assert r['physically_executable_verified'] is False
          assert r['global_acceptance'] is None
          print('STAGED_64_STRUCTURAL_INPUTS_OK; NO_NATIVE_PHYSICS_EXECUTED')
          PY
      - name: Archive source-only structural cards; rebuild with user's native template before execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zee-edm3zero-64-synthetic-SLHA-staging-NOT-native-physics
          path: ${{ runner.temp }}/staged-edm3zero-64/
          if-no-files-found: warn
          retention-days: 30
