name: Zee F16 exact heavy scalar SARAH vertex fixture validation
on:
  push:
    branches: [feature/global-scan-priority1]
    paths:
      - 'scripts/zee_paper1_F16_exact_F13_SARAH_vertex_fixtures.py'
      - 'scripts/zee_paper1_F16_SARAH_three_heavy_vertex_audit.m'
      - 'scripts/zee_paper1_F16_AF_exact_SARAH_one_shot.sh'
      - 'scripts/zee_paper1_F16_local_SARAH_three_heavy_one_shot.sh'
      - 'scripts/zee_paper1_F16_SARAH_MakeUFO_after_vertex_gate.m'
      - 'scripts/zee_paper1_F16_verify_AF_to_local_bundle.py'
      - 'scripts/zee_paper1_F16_wolfram_syntax_lint.py'
      - 'scripts/zee_paper1_F16_SARAH_context_vevs.m'
      - 'scripts/zee_paper1_F16_SARAH_context_vevs_selftest.m'
      - 'tests/test_zee_paper1_F16_vev_context_faithful.py'
      - 'tests/test_zee_paper1_F16_wolfram_syntax_lint.py'
      - 'tests/test_zee_paper1_F16_AF_to_local_bundle_provenance.py'
      - 'tests/test_zee_paper1_F16_exact_SARAH_three_width_handoff.py'
      - '.github/workflows/zee-paper1-f16-sarah-width.yml'
  workflow_dispatch:
jobs:
  independently_rebuild_actual_heavy_Zee_neutrino_for_SARAH:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy
      - run: python -m py_compile scripts/zee_paper1_F16_exact_F13_SARAH_vertex_fixtures.py tests/test_zee_paper1_F16_exact_SARAH_three_width_handoff.py
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_F16_exact_SARAH_three_width_handoff.py' -v
      - run: bash -n scripts/zee_paper1_F16_AF_exact_SARAH_one_shot.sh
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_F16_AF_to_local_bundle_provenance.py' -v
      - run: bash -n scripts/zee_paper1_F16_local_SARAH_three_heavy_one_shot.sh
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_F16_wolfram_syntax_lint.py' -v
      - run: python scripts/zee_paper1_F16_wolfram_syntax_lint.py scripts/zee_paper1_F16_SARAH_three_heavy_vertex_audit.m scripts/zee_paper1_F16_SARAH_MakeUFO_after_vertex_gate.m scripts/zee_paper1_F16_SARAH_context_vevs.m scripts/zee_paper1_F16_SARAH_context_vevs_selftest.m
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_F16_vev_context_faithful.py' -v
