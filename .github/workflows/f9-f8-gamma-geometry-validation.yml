name: F9 F8 Gamma Flavor Geometry Source-safe Validation

on:
  push:
    branches:
      - gateA1p-independent-hepfit-typeii-matching
  pull_request:
  workflow_dispatch:

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile F9 source and regressions
        run: |
          python -m py_compile scripts/zee_gateF9_F8_mixing_flavor_geometry_132.py tests/test_zee_gateF9_F8_mixing_flavor_geometry_132.py
      - name: Synthetic full F8 309 + 132 provenance and geometry tests
        run: |
          python -m unittest discover -s tests -p 'test_zee_gateF9_F8_mixing_flavor_geometry_132.py' -v
