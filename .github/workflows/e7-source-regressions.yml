name: E7 Source-Safe Unit Regressions

on:
  push:
    branches:
      - gateA1p-independent-hepfit-typeii-matching
  pull_request:
  workflow_dispatch:

jobs:
  e7-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: |
          python -m py_compile scripts/zee_gateE7_309_general_lepton_width_pareto.py tests/test_zee_gateE7_309_general_lepton_width_pareto.py
      - name: Run complete E7 synthetic SHA / Pareto / width accounting regressions
        run: |
          python -m unittest discover -s tests -p 'test_zee_gateE7_309_general_lepton_width_pareto.py' -v
