name: Zee 16 certified scalars x NO IO x two fresh algebraic textures
on:
  push:
    branches: [research/zee-full-constraints]
    paths:
      - research/full_constraints/scan_pilot_2026/analytic_direct_lfv_textures.py
      - research/full_constraints/scan_pilot_2026/bounded_16_scalar_64_family.py
      - research/full_constraints/scan_pilot_2026/test_bounded_16_scalar_64_family.py
      - .github/workflows/zee-16-scalar-64-algebraic-flavor.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-certified-scalar-flavor-ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Pinned entire Zee and flavio source numerical runtime
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-16x4"
          uv pip install --python "$RUNNER_TEMP/zee-16x4/bin/python" flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0
          echo "$RUNNER_TEMP/zee-16x4/bin" >> "$GITHUB_PATH"
      - name: Verify scalar provenance and absent 13TeV production not silently zero
        run: |
          python -m unittest research.full_constraints.scan_pilot_2026.test_bounded_16_scalar_64_family -v
          python -m unittest research.full_constraints.scan_pilot_2026.test_analytic_direct_lfv_textures -v
      - name: Actual fixed 16-scalar 64-neutrino-family leading-constraint exercise
        run: |
          python -u -m research.full_constraints.scan_pilot_2026.bounded_16_scalar_64_family --output "$RUNNER_TEMP/zee-16-scalar-64-constructed-neutrino-families.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zee-sixteen-fixed-scalars-64-algebraic-flavor-cards-not-fully-allowed
          path: ${{ runner.temp }}/zee-16-scalar-64-constructed-neutrino-families.json
          if-no-files-found: error
          retention-days: 30
