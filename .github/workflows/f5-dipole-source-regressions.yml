name: F5 Source-Safe Dipole Tests

on:
  push:
    branches:
      - gateA1p-independent-hepfit-typeii-matching
  pull_request:
  workflow_dispatch:

jobs:
  f5-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile F5 tests
        run: python -m py_compile scripts/zee_gateF5_309_source_pinned_C7_dipole_pareto.py tests/test_zee_gateF5_309_source_pinned_C7_dipole_pareto.py
      - name: Test source SHA, eight TypeII closures and 309-point perturbative projector
        run: python -m unittest discover -s tests -p 'test_zee_gateF5_309_source_pinned_C7_dipole_pareto.py' -v
