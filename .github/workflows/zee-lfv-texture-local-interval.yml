name: Zee local homogeneous-texture LFV materiality width
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/scan_pilot_2026/eta_local_interval.py
      - research/full_constraints/scan_pilot_2026/test_eta_local_interval.py
      - .github/workflows/zee-lfv-texture-local-interval.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-interval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Exact Python and source-pinned numerical dependencies
        run: |
          uv python install 3.10.12
          uv venv --python 3.10.12 "$RUNNER_TEMP/zee-rays"
          uv pip install --python "$RUNNER_TEMP/zee-rays/bin/python" numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0
          echo "$RUNNER_TEMP/zee-rays/bin" >> "$GITHUB_PATH"
      - name: Test original texture LFV and both signs of local interval
        run: python -m unittest research.full_constraints.scan_pilot_2026.test_eta_local_interval -v
      - name: Compute four source-matched local homogeneous texture intervals
        run: |
          python -m research.full_constraints.scan_pilot_2026.eta_local_interval --output "$RUNNER_TEMP/zee-lfv-local-eta-intervals.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zee-local-texture-lfv-one-ray-intervals-not-physical
          path: ${{ runner.temp }}/zee-lfv-local-eta-intervals.json
          if-no-files-found: error
          retention-days: 30
