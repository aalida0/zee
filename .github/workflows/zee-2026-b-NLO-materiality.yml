name: Zee 2026 NLO-dipole matching effect on published LO-NP B gamma
on:
  push:
    branches: [research/zee-full-constraints]
    paths:
      - research/full_constraints/bsgamma_flavio_2026/nlo_dipole_materiality.py
      - research/full_constraints/bsgamma_flavio_2026/test_nlo_dipole_materiality.py
      - .github/workflows/zee-2026-b-NLO-materiality.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-matching-order-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Pin independent backend version and coupling
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-b-NLO"
          uv pip install --python "$RUNNER_TEMP/zee-b-NLO/bin/python" flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0
          echo "$RUNNER_TEMP/zee-b-NLO/bin" >> "$GITHUB_PATH"
      - name: Validate order and no fake two-loop physical completion
        run: python -m unittest research.full_constraints.bsgamma_flavio_2026.test_nlo_dipole_materiality -v
      - name: Run 16 scalar NLO dipole matching materiality and one-state published 670 check
        run: |
          python -u -m research.full_constraints.bsgamma_flavio_2026.nlo_dipole_materiality --output "$RUNNER_TEMP/zee-Bgamma-2026-16-scalar-NLO-dipole-only.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zee-Bgamma-2026-16-NLO-dipole-materiality-not-physical-rate
          path: ${{ runner.temp }}/zee-Bgamma-2026-16-scalar-NLO-dipole-only.json
          retention-days: 30
          if-no-files-found: error
