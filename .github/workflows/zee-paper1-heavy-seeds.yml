name: Zee Paper1 heavy-seed numerical validation
on:
  push:
    branches: [feature/global-scan-priority1]
    paths:
      - 'scripts/zee_paper1_F13_heavy_P1_seeds.py'
      - '.github/workflows/zee-paper1-heavy-seeds.yml'
      - 'scripts/zee_paper1_F13_heavy_flavor_aware_final_scan.py'
      - 'tests/test_zee_paper1_F13_heavy_flavor_aware_final_scan.py'
  workflow_dispatch:
jobs:
  genuine-heavy-scalar-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy
      - name: Search genuine P1 heavy scalar seeds with BFB unitarity EWPO
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from zee_paper1_F13_heavy_P1_seeds import validated_p1_seeds
          seeds,stats=validated_p1_seeds(160,40,20261021,max_seeds=4)
          print('F13_HEAVY_SEED_TEST',stats)
          for _,r in seeds:
            print('F13_HEAVY_SEED',r['id'],r['mH1'],r['mH2'],r['gamma'],r['chi2_Gfitter'])
          assert seeds, 'No physical heavy scalar seed in proposed P1 domain'
          PY
