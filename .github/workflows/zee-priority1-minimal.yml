name: Zee Priority1 Minimal Contracts
on:
  push:
    branches: [zee-global-priority1-minimal]
  pull_request:
  workflow_dispatch:
jobs:
  p1-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and seven minimal scanner tests
        run: |
          python -m py_compile scripts/zee_p1_minimal_pipeline.py scripts/zee_p1_existing_physics.py
          python -m unittest discover -s tests -p 'test_zee_p1_minimal_pipeline.py' -v
