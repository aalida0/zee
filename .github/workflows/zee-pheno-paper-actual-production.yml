name: Zee phenomenology paper source-locked screening, 64 new flavor cards and actual 13/14 TeV MG5
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/pheno_paper_2026/**
      - .github/workflows/zee-pheno-paper-actual-production.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gates-and-fresh-family-collider-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Pinned Zee source + plotting runtime
        run: |
          uv python install 3.11.11
          uv venv --python 3.11.11 "$RUNNER_TEMP/zee-epjc"
          uv pip install --python "$RUNNER_TEMP/zee-epjc/bin/python" \
            flavio==2.7.1 particle==0.26.2 numpy==2.2.6 scipy==1.15.3 \
            mpmath==1.3.0 sympy==1.14.0 matplotlib==3.10.7
          echo "$RUNNER_TEMP/zee-epjc/bin" >> "$GITHUB_PATH"
      - name: Independent paper reviewer/source provenance regression
        run: |
          python -m unittest research.full_constraints.pheno_paper_2026.test_paper_gate -v
      - name: Construct bounded 64 one-loop Zee neutrino/Yukawa families from original 16 scalar records
        run: |
          python -u -m research.full_constraints.scan_pilot_2026.bounded_16_scalar_64_family \
            --output "$RUNNER_TEMP/zee-new-64-neutrino-families.json"
      - name: Combine new-family D4 cascade products with actual 13 and 14 TeV MG5 rates
        run: |
          python -u -m research.full_constraints.pheno_paper_2026.paper_gate \
            --fresh-json "$RUNNER_TEMP/zee-new-64-neutrino-families.json" \
            --output-dir "$RUNNER_TEMP/zee-epjc-paper-evidence"
      - name: Generate two scope-labelled paper-rate plots from exact scalar and family bindings
        run: |
          python -u -m research.full_constraints.pheno_paper_2026.paper_figures \
            --source "$RUNNER_TEMP/zee-epjc-paper-evidence/SOURCE_LOCKED_PAPER_GATE.json" \
            --output-dir "$RUNNER_TEMP/zee-epjc-paper-evidence/figures"
      - name: Archive actual calculations and paper inputs, no blanket allowed claims
        uses: actions/upload-artifact@v4
        with:
          name: zee-EPJC-source-audited-16-scalars-64-flavors-13-and-14TeV-NO-global-acceptance
          path: |
            ${{ runner.temp }}/zee-epjc-paper-evidence/
            ${{ runner.temp }}/zee-new-64-neutrino-families.json
          if-no-files-found: error
          retention-days: 30
