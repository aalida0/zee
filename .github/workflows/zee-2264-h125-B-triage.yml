name: Zee 2264 native Higgs h125 photon and B-gamma single-card triage
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/scan_pilot_2026/h125_b_shortlist_2264.py
      - research/full_constraints/scan_pilot_2026/test_h125_b_shortlist_2264.py
      - .github/workflows/zee-2264-h125-B-triage.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-higgs-and-B:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Exact source-pinned historical Zee numerical runtime
        run: |
          uv python install 3.10.12
          uv venv --python 3.10.12 "$RUNNER_TEMP/zee-h125"
          uv pip install --python "$RUNNER_TEMP/zee-h125/bin/python" numpy==2.2.6 scipy==1.15.3 mpmath==1.3.0 sympy==1.14.0
          echo "$RUNNER_TEMP/zee-h125/bin" >> "$GITHUB_PATH"
      - name: Validate same-card source and no false global Higgs/B classification
        run: |
          python -m unittest research.full_constraints.scan_pilot_2026.test_h125_b_shortlist_2264 -v
      - name: Save new h125 photon widths, total-width-free ratios and B nominal margin
        run: |
          python -m research.full_constraints.scan_pilot_2026.h125_b_shortlist_2264 --output "$RUNNER_TEMP/zee-2264-h125-B-conditional.json"
      - uses: actions/upload-artifact@v4
        with:
          name: zee-2264-fresh-h125-photons-and-B-reference-not-allowed
          path: ${{ runner.temp }}/zee-2264-h125-B-conditional.json
          if-no-files-found: error
          retention-days: 30
