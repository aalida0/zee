name: Zee tau tree and photon coherent interference (phase diagnostic)
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/tau_coherent_tree_dipole_phase_scan.py
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/test_tau_coherent_tree_dipole_phase_scan.py
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/ORIGINAL_NATIVE_TAU_K2_REPLAY_2026-11-10.json
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/test_tau_original_native_source_k2.py
      - .github/workflows/zee-lfv-tau-coherent-phase-scan.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coherent-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy scipy mpmath
      - name: Fetch exact corrected 2HDM reference (read only)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://gitlab.com/jbrod/general-2hdm-pheno.git /tmp/general-2hdm-pheno
          HEAD_SHA=$(git -C /tmp/general-2hdm-pheno rev-parse HEAD)
          echo "CORRECTED_2HDM_HEAD $HEAD_SHA"
          [[ "$HEAD_SHA" == b5035cd5* ]] || exit 2
          echo "9b4af7aa4bf7bf533a7b82c8c2603d118346424e3b7b5f9f06ab8cb41bc4e193  /tmp/general-2hdm-pheno/thdm.py" | sha256sum -c -
      - name: Test two-amplitude spin interference, source and phase gates
        env:
          ZEE_2HDM_PINNED_SOURCE: /tmp/general-2hdm-pheno
        run: python -m unittest research.full_constraints.lfv_2hdm_gitlab_reuse_2026.test_tau_coherent_tree_dipole_phase_scan -v
      - name: Test original complex native source against independent analytic amplitudes
        run: python -m unittest research.full_constraints.lfv_2hdm_gitlab_reuse_2026.test_tau_original_native_source_k2 -v
      - name: Calculate four-card restricted phase scans
        run: |
          python -m research.full_constraints.lfv_2hdm_gitlab_reuse_2026.tau_coherent_tree_dipole_phase_scan --source /tmp/general-2hdm-pheno --commit b5035cd5 --ns 56 --nz 20 --tree-order 24 --output tau_two_amplitude_phase_scan.json
          python -m research.full_constraints.lfv_2hdm_gitlab_reuse_2026.tau_coherent_tree_dipole_phase_scan --source /tmp/general-2hdm-pheno --commit b5035cd5 --ns 56 --nz 20 --tree-order 24 --native-original-json research/full_constraints/lfv_2hdm_gitlab_reuse_2026/ORIGINAL_NATIVE_TAU_K2_REPLAY_2026-11-10.json --output tau_two_amplitude_Native_SARAH_K2_phase_scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: zee-tau-two-amplitude-phase-scan-not-physical
          path: |
            tau_two_amplitude_phase_scan.json
            tau_two_amplitude_Native_SARAH_K2_phase_scan.json
          if-no-files-found: error
