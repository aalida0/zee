name: F7 Legacy-to-2026 BsGamma What-if Tests

on:
  push:
    branches:
      - gateA1p-independent-hepfit-typeii-matching
  pull_request:
  workflow_dispatch:

jobs:
  f7-source-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile F7 source
        run: python -m py_compile scripts/zee_gateF7_309_2026_bsgamma_tension_sensitivity.py tests/test_zee_gateF7_309_2026_bsgamma_tension_sensitivity.py
      - name: Test original F6 source integrity and no-exclusion Gaussian scenarios
        run: python -m unittest discover -s tests -p 'test_zee_gateF7_309_2026_bsgamma_tension_sensitivity.py' -v
