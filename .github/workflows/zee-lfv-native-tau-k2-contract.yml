name: Zee original SARAH tau complex K2 fail-closed import contract
on:
  push:
    branches:
      - research/zee-full-constraints
    paths:
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/tau_native_sarah_complex_import.py
      - research/full_constraints/lfv_2hdm_gitlab_reuse_2026/test_tau_native_sarah_complex_import.py
      - .github/workflows/zee-lfv-native-tau-k2-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate hash/complex norm gate without pretending source execution
        run: python -m unittest research.full_constraints.lfv_2hdm_gitlab_reuse_2026.test_tau_native_sarah_complex_import -v
