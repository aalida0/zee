name: Zee Paper 1 real feasibility scan regression
on:
  push:
    branches: [feature/global-scan-priority1]
    paths:
      - 'scripts/zee_paper1_florentino_feasibility_scan.py'
      - 'scripts/zee_paper1_scan_one_shot.sh'
      - 'tests/test_zee_paper1_florentino_feasibility_scan.py'
      - '.github/workflows/zee-paper1-feasibility.yml'
  workflow_dispatch:
jobs:
  source-and-fast-physics-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy
      - run: python -m py_compile scripts/zee_paper1_florentino_feasibility_scan.py tests/test_zee_paper1_florentino_feasibility_scan.py
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_florentino_feasibility_scan.py' -v
      - run: bash -n scripts/zee_paper1_scan_one_shot.sh
