name: Zee Paper 1 real feasibility scan regression
on:
  push:
    branches: [feature/global-scan-priority1]
    paths:
      - 'scripts/zee_paper1_florentino_feasibility_scan.py'
      - 'scripts/zee_paper1_scan_one_shot.sh'
      - 'tests/test_zee_paper1_florentino_feasibility_scan.py'
      - 'scripts/zee_paper1_F10_six_new_two_charged_legacy_bsgamma.py'
      - 'scripts/zee_paper1_F10_six_legacy_one_shot.sh'
      - 'tests/test_zee_paper1_F10_six_new_two_charged_legacy_bsgamma.py'
      - 'scripts/zee_paper1_F11_six_real_flavio_LO_NP_rate.py'
      - 'scripts/zee_paper1_F11_real_flavio_one_shot.sh'
      - 'tests/test_zee_paper1_F11_six_real_flavio_LO_NP_rate.py'
      - '.github/workflows/zee-paper1-feasibility.yml'
  workflow_dispatch:
jobs:
  source-and-fast-physics-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy scipy flavio wilson
      - run: python -m py_compile scripts/zee_paper1_florentino_feasibility_scan.py tests/test_zee_paper1_florentino_feasibility_scan.py
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_florentino_feasibility_scan.py' -v
      - run: bash -n scripts/zee_paper1_scan_one_shot.sh
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_F10_six_new_two_charged_legacy_bsgamma.py' -v
      - run: bash -n scripts/zee_paper1_F10_six_legacy_one_shot.sh
      - run: python -m unittest discover -s tests -p 'test_zee_paper1_F11_six_real_flavio_LO_NP_rate.py' -v
      - run: bash -n scripts/zee_paper1_F11_real_flavio_one_shot.sh
      - name: Real flavio SM/linear Wilson basis and response validation
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from zee_gateF1_peerreviewed_flavio_27_observable import FlavioEngine,no_np_test,basis_derivative_test
          x=FlavioEngine()
          sm=no_np_test(x)
          deriv=basis_derivative_test(x,sm['flavio_SM'])
          print('F11_REAL_FLAVIO_BASELINE',sm)
          print('F11_REAL_FLAVIO_DERIVATIVE',deriv)
          assert sm['flavio_matches_2015_SM_within_0p20e_4']
          assert deriv['both_operator_derivative_sign_and_scale_consistent']
          PY
      - name: Real one-spectrum numerical smoke (not an exclusion)
        run: |
          python -u scripts/zee_paper1_florentino_feasibility_scan.py \
            --output work/paper1_ci_real_scalar_flavor_smoke \
            --scalar-steps 0 --chains 1 --max-spectra 1 \
            --trials 1 --optimize-seeds 1 --optimize-evals 0 \
            --quadrature-nodes 40 --seed 20261021
          python -c 'import json; r=json.load(open("work/paper1_ci_real_scalar_flavor_smoke/summary.json")); assert r["modern_model_complete_constraints_passed"] is None; assert r["selected_spectra"] == 1; print(r["status"])'
      - name: Actual correlated scalar proposal and local LFV optimizer smoke
        run: |
          python -u scripts/zee_paper1_florentino_feasibility_scan.py \
            --output work/paper1_ci_correlated_scalar_and_optimizer_smoke \
            --scalar-steps 24 --chains 2 --max-spectra 2 \
            --trials 4 --optimize-seeds 1 --optimize-evals 60 \
            --quadrature-nodes 40 --seed 20261022
          python -c 'import json; r=json.load(open("work/paper1_ci_correlated_scalar_and_optimizer_smoke/summary.json")); assert r["new_scalar_proposals_attempted"] == 24; assert r["selected_spectra"] >= 1; assert r["paper1_GO_or_NOGO"] is None; print(r["status"])'
